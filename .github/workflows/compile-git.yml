name: Build Flutter git

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          architecture: x64

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Compress macOS app
        run: zip -r macos-build-app.zip build/macos/Build/Products/Release/LiveText.app

      - name: Upload compressed macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: macos-build-app.zip

build-linux:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'

    - name: Enable Linux desktop
      run: flutter config --enable-linux-desktop

    - name: Get dependencies
      run: flutter pub get

    - name: Install dependencies for Linux build
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev patchelf

    - name: Build Linux app
      run: flutter build linux --release

    # 🧱 Package as AppImage
    - name: Download AppImage tool
      run: |
        wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

    - name: Prepare AppDir
      run: |
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

        # Copy Flutter bundle to AppDir
        cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

        # Try to locate the icon inside the Flutter assets
        ICON_PATH="build/linux/x64/release/bundle/data/flutter_assets/linux/assets/icon.png"
        if [ -f "$ICON_PATH" ]; then
          cp "$ICON_PATH" AppDir/usr/share/icons/hicolor/256x256/apps/icon.png
        else
          echo "⚠️ Icon not found at $ICON_PATH, skipping..."
        fi

        # Create desktop entry for the app
        cat > AppDir/usr/share/applications/livetext.desktop <<EOF
        [Desktop Entry]
        Name=LiveText
        Exec=LiveText
        Icon=livetext
        Type=Application
        Categories=Utility;
        EOF

    - name: Build AppImage
      run: |
        ./appimagetool-x86_64.AppImage AppDir LiveText-x86_64.AppImage

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v4
      with:
        name: livetext-appimage
        path: LiveText-x86_64.AppImage


